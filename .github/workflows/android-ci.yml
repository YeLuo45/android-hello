name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  JAVA_VERSION: '17'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDevDebugUnitTest --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-dev-debug
          path: app/build/reports/tests/testDevDebugUnitTest/
          retention-days: 7

      - name: Build dev debug APK
        run: ./gradlew assembleDevDebug --no-daemon

      - name: Upload dev debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-debug-apk
          path: app/build/outputs/apk/dev/debug/*.apk
          retention-days: 7

  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build prod release APK
        run: ./gradlew assembleProdRelease --no-daemon

      - name: Upload prod release artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod-release-apk
          path: app/build/outputs/apk/prod/release/*.apk
          retention-days: 7

  release:
    needs: [build, build-release]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: apks

      - name: Get version info
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -1)
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$(grep -oP 'versionCode\s+\K\d+' app/build.gradle | head -1)" >> $GITHUB_OUTPUT

      - name: Delete existing release
        uses: dev-drprasad/delete-tag-and-release@v0.2.3
        with:
          delete_release: true
          tag_name: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Release (v${{ steps.version.outputs.VERSION_NAME }})"
          files: |
            apks/dev-debug-apk/*.apk
            apks/prod-release-apk/*.apk
          draft: false
          prerelease: false
          body: |
            ## android-hello v${{ steps.version.outputs.VERSION_NAME }}

            ### Build Variants
            - **dev-debug**: 开发环境调试版
            - **prod-release**: 生产环境发布版 (已签名)

            ### Features
            - MVVM + Compose + Hilt
            - Room Database 持久化
            - Retrofit 网络层
            - Firebase Crashlytics 集成
            - CI/CD 自动化 (GitHub Actions)

            ### CI/CD
            - 自动构建: push到main或PR时触发
            - 单元测试: 自动运行
            - APK发布: 自动上传到Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-tag:
    needs: [build, build-release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: apks

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apks/dev-debug-apk/*.apk
            apks/prod-release-apk/*.apk
          draft: false
          prerelease: false
          body: |
            ## android-hello V3.9.0

            ### Features
            - MVVM + Compose + Hilt
            - Room Database 持久化
            - Retrofit 网络层 (JSONPlaceholder)
            - SavedStateHandle
            - 深色模式 (Material3)
            - Compose UI 测试
            - 国际化 (中/英)
            - CI/CD 流水线
            - Firebase Crashlytics 集成

            ### Build Variants
            - **dev-debug**: 开发环境调试版
            - **prod-release**: 生产环境发布版
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
